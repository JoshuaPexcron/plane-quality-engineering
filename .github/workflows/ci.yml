name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly Monday run: proves the pipeline and the dashboard stay alive
    # even without pushes.
    - cron: '0 6 * * 1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      PLANE_BASE_URL: http://localhost
      # Throwaway credentials for the Plane instance that lives and dies
      # inside this CI run. Not secrets: the instance is only reachable
      # from the runner itself.
      PLANE_ADMIN_EMAIL: ci-admin@example.com
      PLANE_ADMIN_PASSWORD: Ci-Plane-2026-x7K!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Boot Plane
        working-directory: infra/plane
        run: docker compose --env-file variables.env up -d --quiet-pull

      - name: Wait for Plane to be ready
        run: bash infra/plane/wait-for-plane.sh

      - name: Create instance admin
        run: bash infra/plane/setup-admin.sh

      - name: Seed workspaces, roles and API tokens
        run: npm run seed

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JSON results for the dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/results.json
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        working-directory: infra/plane
        run: docker compose --env-file variables.env logs --tail 100 api migrator

  publish:
    needs: test
    # Publish whenever the tests actually ran, passed or failed: a red
    # dashboard is honest and still proves the pipeline works. The
    # !cancelled() matters: without a status function in the condition,
    # GitHub implicitly adds success() and would skip this job on red runs.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download JSON results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: public/report/

      # The script only needs Node built-ins, so no npm ci here.
      - name: Build dashboard
        run: node scripts/build-dashboard.ts

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/
      - id: deployment
        uses: actions/deploy-pages@v4
